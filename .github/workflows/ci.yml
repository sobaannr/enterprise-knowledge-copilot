name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COPILOT_RETRIEVAL_BACKEND: local
      COPILOT_GENERATION_BACKEND: extractive
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -c requirements.lock -e '.[test]'
      - run: ruff check copilot tests
      - run: pytest -q
      - run: copilot seed && copilot evaluate --offline
